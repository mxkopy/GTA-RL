

message ByteBuffer {
 required bytes data = 1;
}


message ByteBuffers {
 repeated ByteBuffer data = 1;
}


message Payload {
 required string typename = 1;
 required bytes data = 2;
}


message Vec3f {
 required float x = 1;
 required float y = 2;
 required float z = 3;
}


message RayCast {
 required float x = 1;
 required float y = 2;
 required Vec3f collision = 3;
 required Vec3f position = 4;
 required float nearclip = 5;
 required float farclip = 6;
}


message VertexShaderConstants {
 required float nearclip = 1;
 required float farclip = 2;
 repeated bytes constant_buffers = 3;
}


message CUDAExtent {
 required int64 width = 1;
 required int64 height = 2;
 required int64 depth = 3;
}


message CUDAChannelFormatDesc {
 required uint32 x = 1;
 required uint32 y = 2;
 required uint32 z = 3;
 required uint32 w = 4;
 required uint32 f = 5;
}


message CUDAPitchedArrayObject {
 required bytes handle = 1;
 required CUDAChannelFormatDesc format = 2;
 required uint64 pitch = 3;
 required CUDAExtent extent = 4;
}


message GameState {
 required bool collided = 1;
 required double reward = 2;
}


message KeyboardState {
 required bool w = 1;
 required bool a = 2;
 required bool s = 3;
 required bool d = 4;
}
